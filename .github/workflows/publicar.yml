name: Publicar sitio y datos

on:
  push:
    branches: [main]
    paths:
      - 'ide-datos/**'
      - 'ide-visores/**'
      - '.github/workflows/publicar.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deja terminar un despliegue en curso antes de empezar otro.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Arma la carpeta del sitio. No sabe nada del host: produce estáticos y los
  # sube como artefacto. Este job no cambia si mañana se migra a Cloudflare.
  armar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # fecha_modificacion sale de git log, un clon shallow la falsea.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Deja la URL pública real del sitio en steps.pages.outputs.base_url.
      # La aporta GitHub, así que vale tanto para comodoro-mit.github.io/ide
      # como para un dominio propio configurado en Settings > Pages: no hay
      # ninguna URL escrita a mano que se pueda desactualizar.
      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5

      # ogr2ogr no es necesario: generar_derivados.py cae a su motor en
      # Python puro. Se instala igual, porque es el motor de referencia.
      - name: Instalar GDAL
        run: sudo apt-get update && sudo apt-get install -y gdal-bin

      # Si el catálogo o algún maestro no cumple nomenclatura, no se publica.
      - name: Validar
        run: python ide-datos/scripts/validar_catalogo.py

      # IDE_URL_BASE va por paso y no a nivel de job: el contexto `steps` no
      # existe cuando se evalúa el `env:` de un job, así que ahí saldría vacío.
      # vars.IDE_URL_BASE queda de respaldo por si algún día se publica fuera
      # de GitHub Pages.
      - name: Derivar catálogo
        run: python ide-datos/scripts/derivar_catalogo.py
        env:
          IDE_URL_BASE: ${{ steps.pages.outputs.base_url || vars.IDE_URL_BASE }}

      - name: Generar GeoJSON
        run: python ide-datos/scripts/generar_derivados.py

      # armar_sitio.py exige este XML por cada dataset: sin este paso falla.
      - name: Generar metadatos ISO 19139
        run: python ide-datos/scripts/creador_metadata.py

      - name: Armar sitio
        run: python ide-datos/scripts/armar_sitio.py
        env:
          IDE_URL_BASE: ${{ steps.pages.outputs.base_url || vars.IDE_URL_BASE }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

  # Único job atado al host. Para migrar a Cloudflare Pages se reemplaza por
  # cloudflare/wrangler-action apuntando a la misma carpeta sitio/; el job
  # armar queda intacto.
  desplegar:
    needs: armar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v5
